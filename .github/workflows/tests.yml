name: synthetic-tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-corpus.txt
      - run: python -X utf8 -m unittest discover -v
      - run: python -X utf8 run_algorithm.py --input examples/pairs.jsonl --output-dir demo-output
